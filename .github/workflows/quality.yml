name: Quality Gate

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Ruff, tests, coverage, and capstone evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests scripts

      - name: Run test suite with coverage
        run: >-
          python -m pytest
          --junitxml=artifacts/pytest-results.xml
          --cov=opportunity_sentinel
          --cov-report=term-missing
          --cov-report=xml:artifacts/coverage.xml
          --cov-fail-under=70

      - name: Execute capstone proof paths
        run: python scripts/capstone_demo.py

      - name: Upload evaluator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capstone-evidence-${{ github.sha }}
          path: |
            artifacts/pytest-results.xml
            artifacts/coverage.xml
            artifacts/capstone-evidence.json
          if-no-files-found: error

