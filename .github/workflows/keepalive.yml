name: Production Keepalive

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      NABAA_API_URL: ${{ secrets.NABAA_API_URL }}
    steps:
      - name: Wake production only when configured
        shell: bash
        run: |
          if [[ -z "$NABAA_API_URL" ]]; then
            echo "::notice::Keepalive skipped safely: NABAA_API_URL is not configured."
            exit 0
          fi
          curl --fail --silent --show-error --retry 2 --max-time 90 \
            "${NABAA_API_URL%/}/health"
