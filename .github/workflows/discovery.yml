name: Central Opportunity Discovery

on:
  schedule:
    - cron: "17,47 * * * *"
    - cron: "23 */8 * * *"
    - cron: "11 15 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Job mode
        required: true
        default: fast
        type: choice
        options: [fast, deep, deliver, revalidate]

permissions:
  contents: read

concurrency:
  group: central-opportunity-discovery
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NABAA_API_URL: ${{ secrets.NABAA_API_URL }}
      INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Select job mode
        id: mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.schedule }}" == "23 */8 * * *" ]]; then
            echo "value=deep" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.schedule }}" == "11 15 * * *" ]]; then
            echo "value=revalidate" >> "$GITHUB_OUTPUT"
          else
            echo "value=fast" >> "$GITHUB_OUTPUT"
          fi
      - run: python scripts/scheduled_job.py "${{ steps.mode.outputs.value }}"
      - name: Deliver queued matches
        if: success()
        run: python scripts/scheduled_job.py deliver
