name: Central Opportunity Discovery

on:
  schedule:
    # Offset from the top of the hour to reduce GitHub schedule congestion.
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Job mode
        required: true
        default: fast
        type: choice
        options: [fast, deep, deliver, revalidate]

permissions:
  contents: read

concurrency:
  group: central-opportunity-discovery
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NABAA_API_URL: ${{ secrets.NABAA_API_URL }}
      INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
    steps:
      - name: Require the durable production API
        id: preflight
        shell: bash
        run: |
          if [[ -n "$NABAA_API_URL" && -n "$INTERNAL_API_SECRET" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Discovery skipped safely: configure NABAA_API_URL and INTERNAL_API_SECRET first."
          fi
      - uses: actions/checkout@v4
        if: ${{ steps.preflight.outputs.ready == 'true' }}
      - uses: actions/setup-python@v5
        if: ${{ steps.preflight.outputs.ready == 'true' }}
        with:
          python-version: "3.12"
          cache: pip
      - if: ${{ steps.preflight.outputs.ready == 'true' }}
        run: python -m pip install -e .
      - name: Select job mode
        id: mode
        if: ${{ steps.preflight.outputs.ready == 'true' }}
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour=$((10#$(date -u +%H)))
          minute=$((10#$(date -u +%M)))
          modes="fast"
          if (( hour % 8 == 0 && minute < 30 )); then
            modes="$modes deep"
          fi
          if (( hour == 0 && minute >= 30 )); then
            modes="$modes revalidate"
          fi
          echo "value=$modes" >> "$GITHUB_OUTPUT"
      - name: Run due central collectors
        if: ${{ steps.preflight.outputs.ready == 'true' && steps.mode.outputs.value != 'deliver' }}
        shell: bash
        run: |
          for mode in ${{ steps.mode.outputs.value }}; do
            python scripts/scheduled_job.py "$mode"
          done
      - name: Deliver queued matches
        if: ${{ success() && steps.preflight.outputs.ready == 'true' }}
        run: python scripts/scheduled_job.py deliver
