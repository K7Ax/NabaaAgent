name: Central Opportunity Discovery

on:
  # Keep cloud discovery manual until a persistent Nabaa API is deployed and
  # NABAA_API_URL / INTERNAL_API_SECRET are configured in GitHub Actions.
  # The Telegram bot's local scheduler continues to run independently.
  workflow_dispatch:
    inputs:
      mode:
        description: Job mode
        required: true
        default: fast
        type: choice
        options: [fast, deep, deliver, revalidate]

permissions:
  contents: read

concurrency:
  group: central-opportunity-discovery
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NABAA_API_URL: ${{ secrets.NABAA_API_URL }}
      INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Select job mode
        id: mode
        shell: bash
        run: |
          echo "value=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
      - name: Run selected job
        if: ${{ steps.mode.outputs.value != 'deliver' }}
        run: python scripts/scheduled_job.py "${{ steps.mode.outputs.value }}"
      - name: Deliver queued matches
        if: ${{ success() && env.NABAA_API_URL != '' && env.INTERNAL_API_SECRET != '' }}
        run: python scripts/scheduled_job.py deliver
      - name: Explain skipped delivery
        if: ${{ success() && (env.NABAA_API_URL == '' || env.INTERNAL_API_SECRET == '') }}
        run: echo "::notice::Delivery skipped because NABAA_API_URL and INTERNAL_API_SECRET are not configured."
