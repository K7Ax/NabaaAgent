[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opportunity-sentinel"
version = "0.1.0"
description = "Verified student opportunity discovery agent for technical students in Riyadh."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.22,<4",
  "beautifulsoup4>=4.13,<5",
  "ddgs>=9.5,<10",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "langchain>=1.0,<2",
  "langchain-groq>=1.1,<2",
  "langchain-openai>=1.5,<2",
  "langchain-text-splitters>=1.1,<2",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3.0,<4",
  "langsmith>=0.4,<1",
  "libsql>=0.1,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "structlog>=25.4,<26",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  # The retrieval tests exercise the real FAISS index; only the embedding model is
  # substituted, so these two belong to the test job rather than the runtime image.
  "faiss-cpu>=1.9,<2",
  "langchain-community>=0.4,<1",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]
# Local embeddings for the capstone notebook. Kept out of the runtime and CI installs so
# neither the free-tier deployment nor the test job ever downloads torch: the tests
# substitute a deterministic lexical embedding and exercise the same code path.
capstone = [
  "faiss-cpu>=1.9,<2",
  "jupyterlab>=4.2,<5",
  "langchain-community>=0.4,<1",
  "langchain-huggingface>=1.2,<2",
  "sentence-transformers>=3.0,<6",
]

[project.scripts]
opportunity-bot = "opportunity_sentinel.telegram_bot:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opportunity_sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["work", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
